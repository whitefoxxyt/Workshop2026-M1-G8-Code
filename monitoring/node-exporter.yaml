apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: workshop

spec:
  selector:
    matchLabels:
      app: node-exporter

  template:
    metadata:
      labels:
        app: node-exporter

    spec:
      containers:
        - name: node-exporter
          image: prom/node-exporter:latest

          args:
            - "--path.rootfs=/host"

          ports:
            - containerPort: 9100

          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer

      volumes:
        - name: rootfs
          hostPath:
            path: /
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: workshop

spec:
  selector:
    app: node-exporter

  ports:
    - protocol: TCP
      port: 9100
      targetPort: 9100

  type: ClusterIP